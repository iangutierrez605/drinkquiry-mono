services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drinkquiry}
      POSTGRES_USER: ${POSTGRES_USER:-drinkquiry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drinkquiry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drinkquiry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-drinkquiry}:${POSTGRES_PASSWORD:-drinkquiry}@db:5432/${POSTGRES_DB:-drinkquiry}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - media:/app/media
    ports:
      - "8000:8000"
    healthcheck:
      # §I3 (Handoff #10): the app's own /api/health/ (DB SELECT 1 + Redis
      # probe). python -c instead of curl/wget — the image has Python, and
      # this avoids growing it.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  pgdata:
  media:
